version: '3.7'

services:
  # Redis (cache e sessões)
  redis-fc:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_fc_data:/data
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == manager-jedy
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - network_swarm_public

  # Aplicação Finance Control
  finance-control:
    image: finance-control:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      # Ajuste a URL do PostgreSQL conforme seu ambiente
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/finance_control?schema=public
      REDIS_URL: redis://redis-fc:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-in-production-32ch}
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == manager-jedy
      resources:
        limits:
          cpus: "1"
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.finance-control.rule=Host(`finance.meudominio.com.br`)"
        - "traefik.http.services.finance-control.loadbalancer.server.port=3000"
        - "traefik.http.routers.finance-control.service=finance-control"
        - "traefik.http.routers.finance-control.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.finance-control.entrypoints=websecure"
        - "traefik.http.routers.finance-control.tls=true"
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - network_swarm_public

networks:
  network_swarm_public:
    name: network_swarm_public
    external: true

volumes:
  redis_fc_data:
    external: true
